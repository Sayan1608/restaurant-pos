name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://pos:pos@localhost:5432/pos?schema=public
  REDIS_URL: redis://localhost:6379

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pos -d pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @pos/api db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm --filter @pos/api db:deploy

      - name: Migration status
        run: pnpm db:migrate:check

      # Fails if schema.prisma has changes that no migration captures -- the
      # mistake that makes a deploy silently diverge from the committed schema.
      # Needs a scratch database, so it only runs here, never on a dev machine.
      - name: Migration drift check
        working-directory: apps/api
        run: >-
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$DATABASE_URL"
          --exit-code

      # Coverage thresholds are only real if CI enforces them, so the pipeline
      # runs the coverage variant rather than a bare test run.
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
